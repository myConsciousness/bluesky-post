name: bluesky_post
description: A GitHub Action to post to Bluesky Social, packaged as a Dart Docker container.
version: 6.0.0
publish_to: none
environment:
  sdk: ^3.3.0

dependencies:
  actions_toolkit_dart: ^0.5.1
  bluesky: ^0.18.0
  bluesky_text: ^0.7.0
  http: ^1.1.0

dev_dependencies:
  lints: ^2.0.1
  test: ^1.21.0
  import_sorter: ^4.6.0

import_sorter:
  emojis: true
